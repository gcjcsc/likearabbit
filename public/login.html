<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in · MCF Rabbitry</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MCF Rabbits">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#26201c" media="(prefers-color-scheme: dark)">
</head>
<body class="login-page">
  <form class="card login" id="login">
    <img src="/favicon.svg" alt="" width="56" height="56">
    <h1>MCF Rabbitry</h1>
    <p class="muted">Herd and pedigree records</p>
    <label>Password <input type="password" name="password" autocomplete="current-password" required autofocus></label>
    <p class="error" id="error" role="alert" hidden></p>
    <button class="button primary" type="submit">Sign in</button>
  </form>
  <script>
    const form = document.getElementById("login");
    const error = document.getElementById("error");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      error.hidden = true;
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: form.password.value }),
      });
      if (res.ok) return location.replace("/");
      error.textContent = (await res.json().catch(() => ({}))).error || "Couldn't sign in.";
      error.hidden = false;
    });
  </script>
</body>
</html>
